<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<meta name="description" content="NutriFoto: estima información nutricional a partir de una foto de comida.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>NutriFoto</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7f5;color:#172017}
header{background:#2e7d32;color:#fff;padding:22px 18px 18px;text-align:center}
main{max-width:620px;margin:auto;padding:18px}
.card{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #00000012}
button{border:0;border-radius:14px;padding:14px 18px;font-size:16px;font-weight:700;cursor:pointer}
.primary{background:#2e7d32;color:#fff;width:100%}
.secondary{background:#e8f1e8;color:#245c28;width:100%;margin-top:10px}
input[type=file]{display:none}
.preview{width:100%;max-height:360px;object-fit:cover;border-radius:14px;margin-top:14px;display:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{background:#f1f6f1;border-radius:14px;padding:14px}
.metric b{font-size:24px;display:block}
.muted{color:#667066;font-size:14px}
#results{display:none}
.food{padding:10px 0;border-bottom:1px solid #eee}
.food:last-child{border-bottom:0}
.small{font-size:13px}
.history-item{padding:13px 0;border-bottom:1px solid #eee}
.history-item:last-child{border-bottom:0}
.history-date{font-size:13px;color:#667066;margin-bottom:4px}
.history-values{font-size:14px;color:#3f493f}
.history-actions{display:flex;gap:8px;margin-top:10px}
.history-actions button{padding:9px 12px;font-size:13px}
.danger{background:#f9e8e8;color:#9b2c2c}
.empty{padding:8px 0;color:#667066;font-size:14px}
</style>
</head>

<body>

<header>
<h1>🥗 NutriFoto</h1>
<div>Información nutricional estimada a partir de tu plato</div>
</header>

<main>

<section class="card">
<h2>📷 Analiza tu plato</h2>

<p class="muted">
Haz una foto de tu plato o selecciona una imagen de tu galería.
</p>

<button id="cameraButton" class="primary">
📸 Hacer foto
</button>

<button id="galleryButton" class="secondary">
🖼️ Elegir de la galería
</button>

<input id="camera" type="file" accept="image/*" capture="environment">
